name: CI

on:
  push:
    paths:
      - "ikev2-strongswan-ubuntu.sh"
      - "ikev2-linux-client.sh"
      - "ikev2-windows-client.ps1"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - "webui/**"
      - "packaging/**"
      - ".github/workflows/deploy-webui.yml"
  pull_request:
    paths:
      - "ikev2-strongswan-ubuntu.sh"
      - "ikev2-linux-client.sh"
      - "ikev2-windows-client.ps1"
      - ".github/workflows/ci.yml"
      - "tests/**"
      - "webui/**"
      - "packaging/**"
      - ".github/workflows/deploy-webui.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck and Caddy for proxy integration tests
        run: sudo apt-get update && sudo apt-get install -y shellcheck caddy

      - name: Check Bash scripts
        run: |
          bash -n ikev2-strongswan-ubuntu.sh ikev2-linux-client.sh packaging/install-webui.sh packaging/install-arvan-proxy.sh
          shellcheck --severity=warning ikev2-strongswan-ubuntu.sh ikev2-linux-client.sh packaging/install-webui.sh packaging/install-arvan-proxy.sh

      - name: Check Web UI JavaScript syntax
        run: |
          node --check webui/static/app.js
          node --check webui/static/qrcodegen.js
          node --check tests/test_webui_browser.cjs

      - name: Test ACME and Web UI
        run: python3 -B -m unittest discover -s tests -v

      - name: Check PowerShell syntax
        shell: bash
        run: |
          pwsh -NoProfile -Command '
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("ikev2-windows-client.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          '

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser test tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ikev2-ui-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1 jsqr@1.4.0
          node "$RUNNER_TEMP/ikev2-ui-tools/node_modules/playwright/cli.js" install --with-deps firefox

      - name: Test dashboard behavior in Firefox with mocked APIs
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/ikev2-ui-tools/node_modules" node --test tests/test_webui_browser.cjs
