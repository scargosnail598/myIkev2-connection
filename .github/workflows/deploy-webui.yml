name: Deploy Production Web UI

on:
  workflow_dispatch:
    inputs:
      reset_admin_password:
        description: Reset the admin account to PRODUCTION_WEBUI_PASSWORD and sign out existing sessions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-webui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_PORT }}
      DEPLOY_USER: ${{ vars.PRODUCTION_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Web UI
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n packaging/install-webui.sh
          shellcheck packaging/install-webui.sh
          node --check webui/static/app.js
          python3 -B -m unittest discover -s tests -p 'test_webui.py' -v

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ikev2-production-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ikev2-known-hosts"

      - name: Install or update Web UI and verify health
        shell: bash
        env:
          INITIAL_PASSWORD: ${{ secrets.PRODUCTION_WEBUI_PASSWORD }}
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}
        run: |
          # Staging paths are deliberately expanded locally after validation.
          # shellcheck disable=SC2029
          set -Eeuo pipefail
          ssh_args=(
            -i "$RUNNER_TEMP/ikev2-production-key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/ikev2-known-hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -p "$DEPLOY_PORT"
          )
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          if [[ "$RESET_ADMIN_PASSWORD" == "true" && ${#INITIAL_PASSWORD} -lt 12 ]]; then
            printf 'Set PRODUCTION_WEBUI_PASSWORD to at least 12 characters before resetting credentials.\n' >&2
            exit 1
          fi
          # Report the effective deployment policy before changing server files.
          ssh "${ssh_args[@]}" "$remote" 'sudo -n -l'
          remote_stage=$(ssh "${ssh_args[@]}" "$remote" 'mktemp -d /tmp/ikev2-web.XXXXXXXX')
          [[ "$remote_stage" =~ ^/tmp/ikev2-web\.[a-zA-Z0-9]+$ ]]
          cleanup() {
            ssh "${ssh_args[@]}" "$remote" "rm -rf -- '$remote_stage'" || true
          }
          trap cleanup EXIT
          # Archive tracked sources only: never upload local configs, keys, or caches.
          git archive --format=tar.gz --output="$RUNNER_TEMP/ikev2-web.tar.gz" HEAD webui packaging
          ssh "${ssh_args[@]}" "$remote" "tar -xz -C '$remote_stage'" < "$RUNNER_TEMP/ikev2-web.tar.gz"
          # Publish root-owned sources to the fixed path allowed by sudoers.
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$remote_stage" <<'REMOTE'
          set -Eeuo pipefail
          source_dir="$1"
          deploy_dir=/opt/ikev2-web-deploy
          sudo -n /usr/bin/install -d -o root -g root -m 0755 \
            "$deploy_dir" "$deploy_dir/webui" "$deploy_dir/webui/static" \
            "$deploy_dir/packaging" "$deploy_dir/packaging/systemd"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/webui/__init__.py" "$source_dir/webui/app.py" \
            "$source_dir/webui/broker.py" "$source_dir/webui/manage.py" \
            "$source_dir/webui/security.py" "$deploy_dir/webui/"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/webui/static/index.html" "$source_dir/webui/static/app.css" \
            "$source_dir/webui/static/app.js" "$deploy_dir/webui/static/"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/packaging/systemd/ikev2-web.service" \
            "$source_dir/packaging/systemd/ikev2-web-broker.service" \
            "$deploy_dir/packaging/systemd/"
          sudo -n /usr/bin/install -o root -g root -m 0755 \
            "$source_dir/packaging/install-webui.sh" "$deploy_dir/packaging/install-webui.sh"
          REMOTE
          # The initial password travels over SSH stdin, never in arguments or logs.
          # On updates the installer preserves the existing authentication config.
          printf '%s' "$INITIAL_PASSWORD" | ssh "${ssh_args[@]}" "$remote" \
            'sudo -n /opt/ikev2-web-deploy/packaging/install-webui.sh install --password-stdin'

          if [[ "$RESET_ADMIN_PASSWORD" == "true" ]]; then
            # Keep the credential file within the mode-0700 SSH staging directory.
            # Preserve cookie/session settings and replace only the admin credentials.
            ssh "${ssh_args[@]}" "$remote" bash -s -- "$remote_stage/auth.json" <<'RESET'
          set -Eeuo pipefail
          sudo -n /usr/bin/install -o "$(id -u)" -g "$(id -g)" -m 0600 /etc/ikev2-web/config.json "$1"
          RESET
            printf '%s' "$INITIAL_PASSWORD" | ssh "${ssh_args[@]}" "$remote" \
              "cd /opt/ikev2 && /usr/bin/python3 -B -m webui.manage reset-password --config '$remote_stage/auth.json' --username admin --password-stdin"
            ssh "${ssh_args[@]}" "$remote" \
              "sudo -n /usr/bin/install -o ikev2-web -g ikev2-web -m 0600 '$remote_stage/auth.json' /etc/ikev2-web/config.json && sudo -n /usr/bin/systemctl restart ikev2-web.service"
            ssh "${ssh_args[@]}" "$remote" \
              'curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 3 --output /dev/null http://127.0.0.1:8787/api/health'
            # Verify the real login and authenticated dashboard without logging credentials or tokens.
            python3 -c 'import json, os; print(json.dumps({"username": "admin", "password": os.environ["INITIAL_PASSWORD"]}))' | \
              ssh "${ssh_args[@]}" "$remote" \
                "umask 077; curl --fail --silent --show-error --max-time 10 --output /dev/null --cookie-jar '$remote_stage/cookies' --header 'Content-Type: application/json' --data-binary @- http://127.0.0.1:8787/api/auth/login"
            ssh "${ssh_args[@]}" "$remote" \
              "curl --fail --silent --show-error --max-time 15 --output /dev/null --cookie '$remote_stage/cookies' http://127.0.0.1:8787/api/dashboard"
            printf 'Admin login and authenticated dashboard verified.\n'
          fi

      - name: Remove SSH credentials from runner
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/ikev2-production-key" "$RUNNER_TEMP/ikev2-known-hosts"
