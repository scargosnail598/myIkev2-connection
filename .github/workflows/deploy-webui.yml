name: Deploy Production Web UI

on:
  workflow_dispatch:
    inputs:
      publish_arvan:
        description: Publish through unprivileged Caddy on HTTP 8080 for p.mahanfreenet.ir (Arvan peers only)
        type: boolean
        default: false
      inspect_origin:
        description: Only inspect origin web listeners and installed web-server tools
        type: boolean
        default: false
      reset_admin_password:
        description: Reset the admin account to PRODUCTION_WEBUI_PASSWORD and sign out existing sessions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-webui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
      DEPLOY_PORT: ${{ vars.PRODUCTION_PORT }}
      DEPLOY_USER: ${{ vars.PRODUCTION_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Web UI
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n packaging/install-webui.sh packaging/install-arvan-proxy.sh
          shellcheck packaging/install-webui.sh packaging/install-arvan-proxy.sh
          node --check webui/static/app.js
          python3 -B -m unittest discover -s tests -p 'test_webui.py' -v
          python3 -B -m unittest discover -s tests -p 'test_arvan_proxy.py' -v

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ikev2-production-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ikev2-known-hosts"

      - name: Inspect origin web services
        if: ${{ inputs.inspect_origin }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/ikev2-production-key" \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ikev2-known-hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          printf 'Origin web listeners:\n'
          ss -H -lnt '( sport = :80 or sport = :443 or sport = :8080 or sport = :8787 )'
          printf 'Installed web tools:\n'
          cat /etc/os-release
          apt-cache policy caddy
          for tool in nginx caddy apache2 certbot; do
            command -v "$tool" || true
          done
          printf 'Web service state:\n'
          systemctl is-active nginx.service caddy.service apache2.service ikev2-web.service ikev2-web-proxy.service || true
          printf 'Public origin HTTPS health:\n'
          curl --silent --show-error --max-time 5 --resolve p.mahanfreenet.ir:443:127.0.0.1 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' https://p.mahanfreenet.ir/api/health || true
          REMOTE

      - name: Install or update Web UI and verify health
        if: ${{ !inputs.inspect_origin }}
        shell: bash
        env:
          INITIAL_PASSWORD: ${{ secrets.PRODUCTION_WEBUI_PASSWORD }}
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}
          PUBLISH_ARVAN: ${{ inputs.publish_arvan }}
        run: |
          # Staging paths are deliberately expanded locally after validation.
          # shellcheck disable=SC2029
          set -Eeuo pipefail
          ssh_args=(
            -i "$RUNNER_TEMP/ikev2-production-key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/ikev2-known-hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -p "$DEPLOY_PORT"
          )
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          if [[ "$RESET_ADMIN_PASSWORD" == "true" && ${#INITIAL_PASSWORD} -lt 12 ]]; then
            printf 'Set PRODUCTION_WEBUI_PASSWORD to at least 12 characters before resetting credentials.\n' >&2
            exit 1
          fi
          # Report the effective deployment policy before changing server files.
          ssh "${ssh_args[@]}" "$remote" 'sudo -n -l'
          remote_stage=$(ssh "${ssh_args[@]}" "$remote" 'mktemp -d /tmp/ikev2-web.XXXXXXXX')
          [[ "$remote_stage" =~ ^/tmp/ikev2-web\.[a-zA-Z0-9]+$ ]]
          cleanup() {
            ssh "${ssh_args[@]}" "$remote" "rm -rf -- '$remote_stage'" || true
          }
          trap cleanup EXIT
          # Archive tracked sources only: never upload local configs, keys, or caches.
          git archive --format=tar.gz --output="$RUNNER_TEMP/ikev2-web.tar.gz" HEAD webui packaging
          ssh "${ssh_args[@]}" "$remote" "tar -xz -C '$remote_stage'" < "$RUNNER_TEMP/ikev2-web.tar.gz"
          # Publish root-owned sources to the fixed path allowed by sudoers.
          ssh "${ssh_args[@]}" "$remote" bash -s -- "$remote_stage" "$PUBLISH_ARVAN" <<'REMOTE'
          set -Eeuo pipefail
          source_dir="$1"
          deploy_dir=/opt/ikev2-web-deploy
          sudo -n /usr/bin/install -d -o root -g root -m 0755 \
            "$deploy_dir" "$deploy_dir/webui" "$deploy_dir/webui/static" \
            "$deploy_dir/packaging" "$deploy_dir/packaging/systemd"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/webui/__init__.py" "$source_dir/webui/app.py" \
            "$source_dir/webui/broker.py" "$source_dir/webui/manage.py" \
            "$source_dir/webui/security.py" "$deploy_dir/webui/"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/webui/static/index.html" "$source_dir/webui/static/app.css" \
            "$source_dir/webui/static/app.js" "$deploy_dir/webui/static/"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/packaging/systemd/ikev2-web.service" \
            "$source_dir/packaging/systemd/ikev2-web-broker.service" \
            "$source_dir/packaging/systemd/ikev2-web-proxy.service" \
            "$deploy_dir/packaging/systemd/"
          sudo -n /usr/bin/install -o root -g root -m 0644 \
            "$source_dir/packaging/render-arvan-proxy.py" "$deploy_dir/packaging/"
          sudo -n /usr/bin/install -o root -g root -m 0755 \
            "$source_dir/packaging/install-arvan-proxy.sh" "$deploy_dir/packaging/"
          sudo -n /usr/bin/install -o root -g root -m 0755 \
            "$source_dir/packaging/install-webui.sh" "$deploy_dir/packaging/install-webui.sh"
          if [[ "$2" == "true" ]]; then
            sudo -n /usr/bin/install -d -o root -g root -m 0755 /etc/ikev2-web-proxy
            sudo -n /usr/bin/install -o root -g root -m 0644 \
              "$source_dir/packaging/arvan-origin.json" /etc/ikev2-web-proxy/origin.json
          fi
          REMOTE
          # The initial password travels over SSH stdin, never in arguments or logs.
          # On updates the installer preserves the existing authentication config.
          printf '%s' "$INITIAL_PASSWORD" | ssh "${ssh_args[@]}" "$remote" \
            'sudo -n /opt/ikev2-web-deploy/packaging/install-webui.sh install --password-stdin'

          if [[ "$RESET_ADMIN_PASSWORD" == "true" ]]; then
            # Keep the credential file within the mode-0700 SSH staging directory.
            # Preserve cookie/session settings and replace only the admin credentials.
            ssh "${ssh_args[@]}" "$remote" bash -s -- "$remote_stage/auth.json" <<'RESET'
          set -Eeuo pipefail
          sudo -n /usr/bin/install -o "$(id -u)" -g "$(id -g)" -m 0600 /etc/ikev2-web/config.json "$1"
          RESET
            printf '%s' "$INITIAL_PASSWORD" | ssh "${ssh_args[@]}" "$remote" \
              "cd /opt/ikev2 && /usr/bin/python3 -B -m webui.manage reset-password --config '$remote_stage/auth.json' --username admin --password-stdin"
            ssh "${ssh_args[@]}" "$remote" \
              "sudo -n /usr/bin/install -o ikev2-web -g ikev2-web -m 0600 '$remote_stage/auth.json' /etc/ikev2-web/config.json && sudo -n /usr/bin/systemctl restart ikev2-web.service"
            ssh "${ssh_args[@]}" "$remote" \
              'curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 3 --output /dev/null http://127.0.0.1:8787/api/health'
            # Verify the real login and authenticated dashboard without logging credentials or tokens.
            python3 -c 'import json, os; print(json.dumps({"username": "admin", "password": os.environ["INITIAL_PASSWORD"]}))' | \
              ssh "${ssh_args[@]}" "$remote" \
                "umask 077; curl --fail --silent --show-error --max-time 10 --output /dev/null --cookie-jar '$remote_stage/cookies' --header 'Content-Type: application/json' --data-binary @- http://localhost:8787/api/auth/login"
            ssh "${ssh_args[@]}" "$remote" \
              "curl --fail --silent --show-error --max-time 15 --output /dev/null --cookie '$remote_stage/cookies' http://localhost:8787/api/dashboard"
            printf 'Admin login and authenticated dashboard verified.\n'
          fi

      - name: Verify public HTTPS through Arvan without credentials
        if: ${{ !inputs.inspect_origin && inputs.publish_arvan }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = "https://p.mahanfreenet.ir"
          with urlopen(base + "/api/health", timeout=30) as response:
              assert response.status == 200
              assert "no-store" in response.headers.get("Cache-Control", "")
              assert response.headers.get("X-Cache", "").upper() not in ("HIT", "STALE"), "Disable CDN caching"
          try:
              urlopen(base + "/api/dashboard", timeout=30)
          except HTTPError as error:
              assert error.code == 401, f"Expected unauthenticated 401, got {error.code}"
          else:
              raise SystemExit("Dashboard was accessible without authentication")
          print("Public HTTPS health and unauthenticated dashboard denial verified; no credentials sent.")
          PY

      - name: Remove SSH credentials from runner
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/ikev2-production-key" "$RUNNER_TEMP/ikev2-known-hosts"
