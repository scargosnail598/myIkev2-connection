name: Release

on:
  push:
    tags:
      - "server-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing server tag; matching Linux and Windows tags must point to the same commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      server_version: ${{ steps.version.outputs.server_version }}
      linux_version: ${{ steps.version.outputs.linux_version }}
      windows_version: ${{ steps.version.outputs.windows_version }}
      server: ${{ steps.version.outputs.server }}
      linux: ${{ steps.version.outputs.linux }}
      windows: ${{ steps.version.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate tag and artifacts
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin
          release_tag="${RELEASE_TAG}"
          [[ "$release_tag" =~ ^server-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "Expected a server release tag, got: ${release_tag}"
            exit 1
          }

          server="ikev2-strongswan-ubuntu.sh"
          linux="ikev2-linux-client.sh"
          windows="ikev2-windows-client.ps1"
          [[ -f "$server" && -f "$linux" && -f "$windows" ]] || {
            echo "Expected all three component scripts in the repository root"
            exit 1
          }

          server_version=$(sed -nE 's/^CURRENT_INSTALLER_VERSION="([0-9]+\.[0-9]+\.[0-9]+).*"$/\1/p' "$server" | head -n1)
          linux_version=$(sed -nE 's/^APP_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$linux" | head -n1)
          windows_version=$(sed -nE 's/^\$APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$windows" | head -n1)
          [[ -n "$server_version" && -n "$linux_version" && -n "$windows_version" ]] || {
            echo "Could not read all component versions"
            exit 1
          }

          server_tag="server-v${server_version}"
          linux_tag="linux-v${linux_version}"
          windows_tag="windows-v${windows_version}"
          [[ "$release_tag" == "$server_tag" ]] || {
            echo "Server tag/version mismatch: tag=$release_tag script=$server_version"
            exit 1
          }

          release_commit="$(git rev-parse HEAD)"
          for component_tag in "$server_tag" "$linux_tag" "$windows_tag"; do
            git show-ref --tags --verify --quiet "refs/tags/${component_tag}" || {
              echo "Required component tag is missing: ${component_tag}"
              exit 1
            }
            tag_commit="$(git rev-parse "${component_tag}^{commit}")"
            [[ "$tag_commit" == "$release_commit" ]] || {
              echo "Component tag ${component_tag} does not point to the release commit"
              exit 1
            }
          done

          bash -n "$server"
          shellcheck --severity=warning "$server"
          bash -n "$linux"
          shellcheck --severity=warning "$linux"

          echo "server_version=$server_version" >> "$GITHUB_OUTPUT"
          echo "linux_version=$linux_version" >> "$GITHUB_OUTPUT"
          echo "windows_version=$windows_version" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Prepare release bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist
          cp "${{ needs.validate.outputs.server }}" \
            "dist/ikev2-strongswan-ubuntu-v${{ needs.validate.outputs.server_version }}.sh"
          cp "${{ needs.validate.outputs.linux }}" "dist/"
          cp "${{ needs.validate.outputs.windows }}" "dist/"

          cat > dist/RELEASE.json <<EOF
          {
            "channel": "stable",
            "release_tag": "${RELEASE_TAG}",
            "versions": {
              "server": "${{ needs.validate.outputs.server_version }}",
              "linux": "${{ needs.validate.outputs.linux_version }}",
              "windows": "${{ needs.validate.outputs.windows_version }}"
            },
            "artifacts": {
              "server": "ikev2-strongswan-ubuntu-v${{ needs.validate.outputs.server_version }}.sh",
              "linux": "$(basename "${{ needs.validate.outputs.linux }}")",
              "windows": "$(basename "${{ needs.validate.outputs.windows }}")",
              "checksums": "SHA256SUMS"
            }
          }
          EOF

          (
            cd dist
            sha256sum ./* > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${RELEASE_TAG}" \
            --title "IKEv2 VPN Suite ${RELEASE_TAG}" \
            --generate-notes \
            dist/*
