name: Release

on:
  push:
    tags:
      - "server-v*.*.*"
      - "linux-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example server-v6.4.0 or linux-v1.9.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      server: ${{ steps.version.outputs.server }}
      linux: ${{ steps.version.outputs.linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate tag and artifacts
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${RELEASE_TAG}"
          git show-ref --tags --verify --quiet "refs/tags/${release_tag}" || {
            echo "Tag does not exist: ${release_tag}"
            exit 1
          }

          case "$release_tag" in
            server-v*)
              kind="server"
              tag="${release_tag#server-v}"
              ;;
            linux-v*)
              kind="linux"
              tag="${release_tag#linux-v}"
              ;;
            *)
              echo "Unsupported release tag: ${release_tag}"
              exit 1
              ;;
          esac

          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

          mapfile -t server_files < <(find . -maxdepth 1 -type f -name 'ikev2-strongswan-ubuntu.sh' -print | sort)
          mapfile -t linux_files < <(find . -maxdepth 1 -type f -name 'ikev2-linux-client-*.sh' -print | sort)

          [[ ${#server_files[@]} -eq 1 ]] || { echo "Expected one server script"; exit 1; }
          [[ ${#linux_files[@]} -eq 1 ]] || { echo "Expected one Linux client"; exit 1; }

          server="${server_files[0]}"
          linux="${linux_files[0]}"

          server_version=$(sed -nE 's/^CURRENT_INSTALLER_VERSION="([0-9]+\.[0-9]+\.[0-9]+).*"$/\1/p' "$server" | head -n1)
          linux_version=$(sed -nE 's/^APP_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$linux" | head -n1)

          if [[ "$kind" == "server" ]]; then
            [[ "$server_version" == "$tag" ]] || {
              echo "Tag/version mismatch: tag=$tag script=$server_version"
              exit 1
            }
          else
            [[ "$linux_version" == "$tag" ]] || {
              echo "Tag/version mismatch: tag=$tag script=$linux_version"
              exit 1
            }
          fi

          bash -n "$server"
          shellcheck --severity=warning "$server"
          bash -n "$linux"
          shellcheck --severity=warning "$linux"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Prepare release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist

          if [[ "${{ needs.validate.outputs.kind }}" == "server" ]]; then
            cp "${{ needs.validate.outputs.server }}" \
              "dist/ikev2-strongswan-ubuntu-v${{ needs.validate.outputs.version }}.sh"
            cp "${{ needs.validate.outputs.linux }}" "dist/"

            cat > dist/RELEASE.json <<EOF
          {
            "version": "${{ needs.validate.outputs.version }}",
            "channel": "stable",
            "artifacts": {
              "server": "ikev2-strongswan-ubuntu-v${{ needs.validate.outputs.version }}.sh",
              "linux": "$(basename "${{ needs.validate.outputs.linux }}")",
              "checksums": "SHA256SUMS"
            }
          }
          EOF
          else
            cp "${{ needs.validate.outputs.linux }}" "dist/"

            cat > dist/RELEASE.json <<EOF
          {
            "version": "${{ needs.validate.outputs.version }}",
            "channel": "stable",
            "artifacts": {
              "linux": "$(basename "${{ needs.validate.outputs.linux }}")",
              "checksums": "SHA256SUMS"
            }
          }
          EOF
          fi

          (
            cd dist
            sha256sum ./* > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.outputs.kind }}" == "server" ]]; then
            gh release create "${RELEASE_TAG}" \
              --title "IKEv2 Server/Clients ${RELEASE_TAG}" \
              --generate-notes \
              dist/*
          else
            gh release create "${RELEASE_TAG}" \
              --title "IKEv2 Linux Client ${RELEASE_TAG}" \
              --generate-notes \
              dist/*
          fi
